<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0d0a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="racine-192.png"><link rel="apple-touch-icon" href="racine-180.png">
<meta name="description" content="racine.ia — moderniser le système éducatif. Appel, cotes, bulletins officiels, palmarès et rapports aux parents pour toutes vos écoles.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="ecole/config.js"></script>
<title>racine.ia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Mise en page : intro animée du logo, puis une colonne « app » (480 px max) sur fond noir ; cartes citron à cercles concentriques comme accroche, cartes claires pour le détail. */
:root{
  --ink:#0c0d0a; --ink2:#15170f; --ink3:#1f2217; --line:#2c3021;
  --lime:#4a8a2c; --lime2:#2c5e1d; --acc-ink:#f6f5ef; --hi:#9fd062; --cream:#f3f1ec; --mute:#a8ad9c; --orange:#ff6b2c;
  --good:#7fe08a; --bad:#ff7a6b; --warn:#ffc95c;
  --f-d:"Sora","Outfit",system-ui,sans-serif; --f-b:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--f-b);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-d);margin:0;text-wrap:balance;letter-spacing:-.02em;line-height:1.05}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--hi);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px;display:flex;flex-direction:column;gap:18px}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 45%,#1a1d12 0%,#0c0d0a 60%);display:grid;place-items:center;overflow:hidden;cursor:pointer;transition:opacity .6s ease,visibility .6s}
#intro.out{opacity:0;visibility:hidden}
.i-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px}
.i-mark{position:relative;width:min(28vw,112px);aspect-ratio:800/795;animation:mkSpin 1.4s cubic-bezier(.6,0,.2,1) 1.35s both,mkUp .9s cubic-bezier(.6,0,.2,1) 2.3s both}
.i-mark img{position:absolute;display:block;opacity:0;animation:blIn .95s cubic-bezier(.2,1.25,.35,1) both}
.i-ring{position:absolute;left:50%;top:50%;width:100%;aspect-ratio:1;border-radius:50%;border:2px solid var(--hi);transform:translate(-50%,-50%) scale(.4);opacity:0;animation:ring 1.4s ease-out 1.25s both}
.i-ring.r2{animation-delay:1.55s}
.i-word{width:min(42vw,165px);margin-top:4px;clip-path:inset(0 100% 0 0);animation:wd 1s cubic-bezier(.7,0,.2,1) 2.55s forwards}
.i-word img{width:100%;display:block}
.i-slog{margin-top:-10px;font-family:var(--f-d);font-weight:500;font-size:11px;letter-spacing:.06em;color:var(--hi);opacity:0;transform:translateY(10px);animation:fu .7s ease 3.3s forwards}
.i-skip{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12.5px;color:var(--mute);opacity:0;animation:fu .6s ease 1.8s forwards}
@keyframes blIn{from{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(-150deg) scale(.4);filter:blur(8px)}60%{opacity:1}to{opacity:1;transform:none;filter:none}}
@keyframes mkSpin{from{transform:rotate(0)}to{transform:rotate(180deg)}}
@keyframes mkUp{from{scale:1}to{scale:.9}}
@keyframes ring{0%{opacity:.9;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.1)}}
@keyframes wd{to{clip-path:inset(0 0 0 0)}}
@keyframes fu{to{opacity:1;transform:none}}

/* ---------- barre du haut ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;background:var(--ink);box-shadow:0 10px 16px -6px var(--ink)}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;cursor:pointer}
.brand .mk{width:34px;height:34px;animation:slow 24s linear infinite}
.brand .wd{height:20px}
@keyframes slow{to{transform:rotate(360deg)}}
.pill{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill.dark{background:var(--ink);color:var(--cream)}
.pill.ghost{background:var(--ink3);color:var(--cream);border:1px solid var(--line)}
.pill.lime{background:var(--lime);color:var(--acc-ink)}
.pill.sm{padding:8px 14px;font-size:13.5px}
.pill:active{transform:scale(.96)}

/* ---------- héros citron ---------- */
.hero{position:relative;overflow:hidden;border-radius:34px;padding:28px 24px 26px;color:var(--acc-ink);
  background:repeating-radial-gradient(circle at 105% 105%,rgba(255,255,255,.0) 0 26px,rgba(255,255,255,.16) 27px 29px),linear-gradient(150deg,#5f9d38,var(--lime) 45%,var(--lime2))}
.hero .eye{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.hero h1{font-size:clamp(34px,9.5vw,46px);font-weight:800;margin-top:10px}
.hero h1 em{font-style:normal;color:#d9f59a}
.hero p{margin:14px 0 0;font-size:16px;max-width:30ch;color:rgba(246,245,239,.86)}
.hero .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.hero .hmk{position:absolute;right:-46px;top:-40px;width:190px;opacity:.14;animation:slow 40s linear infinite}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--ink2);border:1px solid var(--line);border-radius:22px;padding:14px 10px;text-align:center}
.stat b{display:block;font-family:var(--f-d);font-size:26px;color:var(--hi)}
.stat span{font-size:12.5px;color:var(--mute)}

/* ---------- sections ---------- */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-size:24px;font-weight:700}
.sec-h small{color:var(--mute)}
.lead{color:var(--mute);margin:0;max-width:60ch}
.shots{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.shot{flex:0 0 74%;max-width:300px;scroll-snap-align:start;border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:10px;min-height:250px;position:relative;overflow:hidden}
.shot:nth-child(3n+1){background:linear-gradient(160deg,#4f9030,var(--lime2));color:var(--acc-ink)}
.shot:nth-child(3n+2){background:var(--cream);color:var(--ink)}
.shot:nth-child(3n){background:var(--ink3);color:var(--cream);border:1px solid var(--line)}
.shot .ic{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--ink);color:var(--hi)}
.shot:nth-child(3n) .ic{background:var(--lime);color:var(--acc-ink)}
.shot:nth-child(3n+2) .ic{background:var(--lime2);color:var(--acc-ink)}
.shot h3{font-size:22px;font-weight:700}
.shot p{margin:0;font-size:14.5px;opacity:.82}
.shot .tag{margin-top:auto;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.shot::after{content:"";position:absolute;right:-50px;bottom:-60px;width:150px;height:150px;border-radius:50%;border:22px solid currentColor;opacity:.06}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:14px;align-items:flex-start;background:var(--ink2);border:1px solid var(--line);border-radius:22px;padding:15px 16px}
.row .dot{flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-weight:800}
.row.pro .dot{background:rgba(159,208,98,.14);color:var(--hi)}
.row.con .dot{background:rgba(255,201,92,.14);color:var(--warn)}
.row b{display:block;font-size:15.5px}
.row span{color:var(--mute);font-size:14px}
.row .rep{display:block;margin-top:6px;color:var(--cream);font-size:13.5px}
.row .rep::before{content:"Notre réponse : ";color:var(--hi);font-weight:600}
.steps{display:grid;gap:8px}
.step{display:flex;gap:14px;align-items:center;background:var(--ink2);border:1px solid var(--line);border-radius:22px;padding:14px 16px}
.step i{flex:none;font-style:normal;width:38px;height:38px;border-radius:50%;background:var(--lime);color:var(--acc-ink);display:grid;place-items:center;font-family:var(--f-d);font-weight:800}
.cta{border-radius:30px;padding:24px;background:var(--cream);color:var(--ink);display:flex;flex-direction:column;gap:12px}
.cta h2{font-size:26px}
.cta p{margin:0;color:#3d4130}
.copy{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copy code{font:600 16px var(--f-b);background:#e6e3da;border-radius:12px;padding:9px 12px;user-select:all}

/* ---------- écoles ---------- */
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:12px 18px;outline:none}
.search input:focus{border-color:var(--hi)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--ink2);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--lime);color:var(--acc-ink);border-color:var(--hi)}
.schools{display:grid;gap:12px}
.sc{position:relative;isolation:isolate;display:flex;flex-direction:column;gap:14px;text-align:left;cursor:pointer;padding:18px 16px 16px;border-radius:28px;overflow:hidden;background:var(--cov);border:1px solid rgba(255,255,255,.08);color:#fff}
.sc::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-radial-gradient(circle at 100% 0,transparent 0 18px,rgba(255,255,255,.12) 19px 20px),linear-gradient(180deg,transparent 30%,rgba(0,0,0,.38))}
.sc .body{display:flex;gap:14px;align-items:center}
.logo{flex:none;width:72px;height:72px;border-radius:22px;background:var(--cream);color:var(--ink);display:grid;place-items:center;font-family:var(--f-d);font-weight:800;font-size:24px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.logo img{width:100%;height:100%;object-fit:cover}
.sc .tx{flex:1;min-width:0;padding-bottom:2px}
.sc .tx b{display:block;font-size:17px;line-height:1.2}
.sc .tx span{display:block;color:rgba(255,255,255,.75);font-size:13px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.on{background:rgba(127,224,138,.14);color:var(--good)}
.st.off{background:rgba(255,122,107,.14);color:var(--bad)}
.st.late{background:rgba(255,201,92,.14);color:var(--warn)}
.sc .meta{display:flex;flex-wrap:wrap;gap:8px 16px;color:rgba(255,255,255,.75);font-size:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.16)}
.sc .meta b{color:#fff}
.sc .st{background:rgba(0,0,0,.32)}
.sc.blocked{filter:grayscale(1) brightness(.6)}
.sc.blocked .logo{filter:grayscale(1)}
.add{border:1.5px dashed var(--line);border-radius:28px;background:none;padding:22px;color:var(--mute);font-weight:600;cursor:pointer}

/* ---------- profil d'école ---------- */
.prof-h{position:relative;isolation:isolate;border-radius:34px;overflow:hidden;background:var(--cov);border:1px solid rgba(255,255,255,.08);color:#fff}
.prof-h::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-radial-gradient(circle at 100% 0,transparent 0 22px,rgba(255,255,255,.12) 23px 25px),linear-gradient(180deg,transparent 25%,rgba(0,0,0,.45))}
.prof-h .in{padding:24px 20px 22px;display:flex;flex-direction:column;gap:12px}
.prof-h .kv dt{color:rgba(255,255,255,.7)}
.prof-h .st{background:rgba(0,0,0,.32)}
.prof-h .logo{width:104px;height:104px;border-radius:30px;font-size:34px}
.prof-h h1{font-size:28px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.kv dt{color:var(--mute);font-size:13.5px}.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.lock{border-radius:28px;padding:22px;background:rgba(255,122,107,.1);border:1px solid rgba(255,122,107,.35);display:flex;flex-direction:column;gap:8px}
.lock b{font-family:var(--f-d);font-size:20px;color:var(--bad)}

/* ---------- console ---------- */
.adm{display:flex;flex-direction:column;gap:12px}
.ar{background:var(--ink2);border:1px solid var(--line);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:12px}
.ar .hd{display:flex;gap:12px;align-items:center}
.ar .hd .logo{width:52px;height:52px;border-radius:16px;font-size:18px;box-shadow:none}
.ar .hd .tx{flex:1;min-width:0}.ar .hd b{display:block}.ar .hd span{color:var(--mute);font-size:13px}
.sw{position:relative;width:54px;height:32px;border-radius:999px;border:0;background:var(--line);cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--cream);transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
.sw[aria-checked="true"]{background:var(--lime)}
.sw[aria-checked="true"]::after{transform:translateX(22px);background:var(--acc-ink)}
.ar .pay{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--mute)}
.ar .pay b{color:var(--cream)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ---------- feuille ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--ink2);border:1px solid var(--line);border-radius:30px 30px 0 0;padding:22px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .35s cubic-bezier(.2,1,.3,1);max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{font-size:22px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:13px;font-weight:600;color:var(--mute)}
.f input,.f select{background:var(--ink);border:1px solid var(--line);border-radius:16px;padding:13px 14px;outline:none;width:100%}
.f input:focus{border-color:var(--hi)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{min-height:20px;font-size:14px;color:var(--bad)}
.note{font-size:12.5px;color:var(--mute)}

/* ---------- barre du bas ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.nav-in{display:flex;gap:6px;background:rgba(21,23,15,.92);border:1px solid var(--line);border-radius:999px;padding:6px;pointer-events:auto;backdrop-filter:blur(10px)}
.nb{border:0;background:none;border-radius:999px;padding:11px 16px;font-weight:600;font-size:13.5px;color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .25s,color .25s}
.nb[aria-current="page"]{background:var(--lime);color:var(--acc-ink)}
.nb svg{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--cream);color:var(--ink);font-weight:600;border-radius:999px;padding:11px 18px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.demo{font-size:12.5px;color:var(--mute);text-align:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
</style>

</head><body>
<div id="intro" role="button" aria-label="Passer l’introduction" tabindex="0">
  <div class="i-stage"><div class="i-mark" id="imark"><span class="i-ring"></span><span class="i-ring r2"></span></div>
  <div class="i-word"><img id="iword" alt="racine.ia"></div><div class="i-slog">moderniser le système éducatif.</div></div>
  <div class="i-skip">Touchez l’écran pour entrer</div>
</div>
<div class="app" id="app"></div>
<nav class="nav" aria-label="Navigation"><div class="nav-in" id="nav"></div></nav>

async function loadSchools(){
  if(!sb){DB.err='Connexion impossible pour le moment.';render();return}
  const {data,error}=await sb.rpc('racine_ecoles');
  if(error){DB.err='Impossible de charger les écoles. Vérifiez internet.';render();return}
  DB.ok=true;DB.err='';DB.schools=data.map((r,k)=>({id:r.code.toLowerCase(),code:r.code,nom:r.nom,ville:r.ville||'Kinshasa',commune:r.commune||'—',directeur:r.directeur||'À renseigner',
    classes:r.classes||0,enseignants:r.enseignants||0,logo:r.logo||'',cov:r.couleur||COVS[k%COVS.length],url:r.app||'',actif:r.actif,payeJusqua:r.paye_jusqua||'9999-12-31',plan:r.plan||'Standard',depuis:r.depuis||'',codeDir:!!r.code_dir,devise:r.devise||''}));
  render();
}

   <h1>Moderniser le <em>système éducatif.</em></h1>
   <p>Une seule application pour toutes vos écoles : appel, cotes, bulletins officiels, palmarès et rapports aux parents.</p>
   <div class="acts"><button class="pill dark" data-act="monecole">${ic('school',18)} Mon école</button><button class="pill dark" style="background:rgba(246,245,239,.16);color:var(--acc-ink)" data-act="go" data-v="ecoles">Voir les écoles</button></div></section>
   <div class="stats num"><div class="stat"><b>${DB.schools.length}</b><span>écoles</span></div><div class="stat"><b>${ac}</b><span>actives</span></div><div class="stat"><b>${cl}</b><span>classes</span></div></div>
   <section class="sec"><div class="sec-h"><h2>Ce que fait racine.ia</h2><small>${FEATS.length} outils</small></div>
    <div class="shots">${FEATS.map(([i,t,d,g])=>`<article class="shot"><span class="ic">${ic(i,26)}</span><h3>${t}</h3><p>${d}</p><span class="tag">${g}</span></article>`).join('')}</div></section>
   <section class="sec"><div class="sec-h"><h2>Pourquoi racine.ia</h2></div><div class="list">${PROS.map(([t,d])=>`<div class="row pro"><span class="dot">✓</span><div><b>${t}</b><span>${d}</span></div></div>`).join('')}</div></section>
   <section class="sec"><div class="sec-h"><h2>Les limites à connaître</h2></div><p class="lead">Ce qu’il faut prévoir avant de commencer, et comment nous y répondons.</p>
    <div class="list">${CONS.map(([t,d])=>`<div class="row con"><span class="dot">!</span><div><b>${t}</b><span class="rep">${d}</span></div></div>`).join('')}</div></section>
   <section class="sec"><div class="sec-h"><h2>Comment ça marche</h2></div><div class="steps">${STEPS.map((t,i)=>`<div class="step"><i>${i+1}</i><span>${t}</span></div>`).join('')}</div></section>
   <section class="cta"><h2>Inscrire mon école</h2><p>Contactez racine.ia pour une démonstration gratuite et l’ouverture de l’espace de votre école.</p>
    <div class="copy"><code id="mail">tiyachrimos@gmail.com</code><button class="pill dark sm" data-act="copy">Copier</button></div></section>
   ${DB.err?`<p class="demo">${h(DB.err)}</p>`:''}`;
}
function vEcoles(){
  const q=S.q.toLowerCase();
  const L=DB.schools.filter(s=>(S.filtre==='toutes'||statut(s)===S.filtre||(S.filtre==='on'&&statut(s)==='late'))&&(!q||(s.nom+' '+s.commune+' '+s.code).toLowerCase().includes(q)));
  return `<div class="sec-h"><h2 style="font-size:30px">Les écoles</h2><small class="num">${DB.schools.length} au total</small></div>
   <div class="search"><input id="q" placeholder="Rechercher une école, une commune…" value="${h(S.q)}" aria-label="Rechercher"></div>
   <div class="chips">${[['toutes','Toutes'],['on','Actives'],['off','Suspendues']].map(([k,l])=>`<button class="chip" data-act="filtre" data-v="${k}" aria-pressed="${S.filtre===k}">${l}</button>`).join('')}</div>
   <div class="schools">${L.map(s=>{const st=statut(s);return `<button class="sc ${st==='off'?'blocked':''}" data-act="ecole" data-id="${s.id}" style="--cov:${s.cov}"><span class="body">${logo(s)}<span class="tx"><b>${h(s.nom)}</b><span>${h(s.commune)} · ${h(s.ville)}</span></span><span class="st ${st}">${STL[st]}</span></span><span class="meta num"><span><b>${s.classes}</b> classes</span><span><b>${s.enseignants}</b> enseignants</span><span>Code <b>${h(s.code)}</b></span></span></button>`}).join('')||'<p class="lead">Aucune école ne correspond.</p>'}</div>
   <button class="add" data-act="go" data-v="console">${ic('plus',18)} Ajouter une école (console racine.ia)</button>`;
}
function vEcole(){
  const s=DB.schools.find(x=>x.id===S.sid);if(!s){S.view='ecoles';return vEcoles()}const st=statut(s);
  return `<button class="pill ghost sm" data-act="go" data-v="ecoles" style="align-self:flex-start">${ic('back',16)} Les écoles</button>
   <section class="prof-h" style="--cov:${s.cov}"><div class="in">${logo(s)}<div><span class="st ${st}">${STL[st]}</span><h1 style="margin-top:8px">${h(s.nom)}</h1></div>
    <dl class="kv"><dt>Commune</dt><dd>${h(s.commune)}, ${h(s.ville)}</dd><dt>Directeur</dt><dd>${h(s.directeur)}</dd><dt>Code école</dt><dd>${h(s.code)}</dd><dt>Classes</dt><dd class="num">${s.classes}</dd><dt>Membre depuis</dt><dd>${h(s.depuis)}</dd></dl></div></section>
   ${st==='off'?`<div class="lock"><b>${ic('lock',20)} Accès suspendu</b><span>L’accès à cette école est suspendu par racine.ia. La direction doit régulariser l’abonnement pour que les enseignants retrouvent leurs données. Rien n’est effacé.</span></div>`
    :s.url?`<button class="pill lime" style="justify-content:center;padding:16px" data-act="entrer" data-id="${s.id}">${ic('lock',18)} Entrer dans mon école</button>`
    :`<div class="row"><span class="dot" style="background:var(--ink3)">${ic('school',18)}</span><div><b>Espace en préparation</b><span>L’application de cette école sera disponible dès son ouverture par racine.ia.</span></div></div>`}
   ${st==='late'?`<div class="row con"><span class="dot">!</span><div><b>Paiement en retard</b><span>Abonnement payé jusqu’au ${dfr(s.payeJusqua)}. L’accès reste ouvert pendant la période de grâce.</span></div></div>`:''}`;
}
function vConsole(){
  if(!S.admin)return `<div class="sec-h"><h2 style="font-size:30px">Console racine.ia</h2></div><p class="lead">Espace réservé à l’équipe racine.ia : ouvrir, suspendre et suivre le paiement de chaque école.</p>
   <form id="f-pin" class="ar"><div class="f"><label for="ad-tel">Numéro de téléphone</label><input id="ad-tel" type="tel" inputmode="tel" autocomplete="username" required></div><div class="f"><label for="ad-pw">Mot de passe</label><input id="ad-pw" type="password" autocomplete="current-password" required></div><div class="msg" id="pinmsg"></div><button class="pill lime" style="justify-content:center">Entrer dans la console</button><span class="note">Le même compte que dans l’application de l’école.</span></form>`;
  const n=k=>DB.schools.filter(s=>statut(s)===k).length;
  return `<div class="sec-h"><h2 style="font-size:30px">Console racine.ia</h2><button class="pill ghost sm" data-act="logout">Quitter</button></div>
   <div class="kpi num"><div class="stat"><b>${n('on')}</b><span>à jour</span></div><div class="stat"><b style="color:var(--warn)">${n('late')}</b><span>en retard</span></div><div class="stat"><b style="color:var(--bad)">${n('off')}</b><span>suspendues</span></div></div>
   <button class="pill lime" style="justify-content:center;padding:15px" data-act="newschool">${ic('plus',18)} Ajouter une école</button>
   <div class="adm">${DB.schools.map(s=>{const st=statut(s);return `<div class="ar"><div class="hd">${logo(s)}<span class="tx"><b>${h(s.nom)}</b><span>${h(s.code)} · ${h(s.commune)} · <span class="st ${st}" style="padding:2px 8px">${STL[st]}</span></span></span>
     <button class="sw" role="switch" aria-checked="${s.actif}" aria-label="Accès de ${h(s.nom)}" data-act="toggle" data-id="${s.id}"></button></div>
     <div class="pay"><span>Abonnement ${h(s.plan)} · payé jusqu’au <b>${dfr(s.payeJusqua)}</b></span><button class="pill ghost sm" data-act="pay" data-id="${s.id}">+ 1 mois payé</button></div><div class="pay"><span>Code du directeur : <b>${s.codeDir?'donné':'pas encore donné'}</b></span><button class="pill ${s.codeDir?'ghost':'lime'} sm" data-act="codedir" data-id="${s.id}">${s.codeDir?'Changer le code':'Donner un code'}</button></div></div>`}).join('')}</div>
   <p class="note">L’interrupteur ouvre ou suspend l’accès de l’école. Une école suspendue ne perd aucune donnée : ses enseignants voient un message et retrouvent tout dès la réouverture.</p>`;
}
const VIEWS={accueil:vAccueil,ecoles:vEcoles,ecole:vEcole,console:vConsole};
function render(){
  $('#app').innerHTML=`<header class="top"><button class="brand" data-act="go" data-v="accueil" aria-label="Accueil racine.ia"><img class="mk" src="${A.mark}" alt=""><img class="wd" src="${A.word}" alt="racine.ia"></button><button class="pill lime sm" data-act="monecole">Mon école</button></header>`+VIEWS[S.view]();
  const cur=S.view==='ecole'?'ecoles':S.view;
  $('#nav').innerHTML=[['accueil','Accueil','home'],['ecoles','Écoles','school'],['console','Console','shield']].map(([k,l,i])=>`<button class="nb" data-act="go" data-v="${k}" ${cur===k?'aria-current="page"':''}>${ic(i,20)}<span>${l}</span></button>`).join('');
  const q=$('#q');if(q)q.addEventListener('input',e=>{S.q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)});
}
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)};
const sheet=html=>{$('#ov').innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;$('#ov .sheet').addEventListener('click',e=>e.stopPropagation(),true)};
const close=()=>$('#ov').innerHTML='';
const ACT={
 go:b=>{S.view=b.dataset.v;close();render();scrollTo(0,0)},
 ecole:b=>{S.sid=b.dataset.id;S.view='ecole';render();scrollTo(0,0)},
 filtre:b=>{S.filtre=b.dataset.v;render()},
 close:()=>close(),
 copy:()=>{const t=$('#mail').textContent;navigator.clipboard?.writeText(t).then(()=>toast('Adresse copiée')).catch(()=>{const r=document.createRange();r.selectNodeContents($('#mail'));getSelection().removeAllRanges();getSelection().addRange(r);toast('Adresse sélectionnée : copiez-la')})},
 monecole:()=>sheet(`<h2>Mon école</h2><p class="lead">Entrez le code de votre école, donné par la direction (par exemple CLR).</p>
   <form id="f-code" class="sec"><div class="f"><label for="code">Code de l’école</label><input id="code" autocapitalize="characters" autocomplete="off" placeholder="CLR" style="text-transform:uppercase;font-size:20px;letter-spacing:.12em"></div><div class="msg" id="codemsg"></div>
   <button class="pill lime" style="justify-content:center;padding:15px">Trouver mon école</button></form>
   <button class="pill ghost" style="justify-content:center" data-act="go" data-v="ecoles">Voir toutes les écoles</button>`),
 logout:async()=>{S.admin=false;render()},
 codedir:b=>{const s=DB.schools.find(x=>x.id===b.dataset.id);sheet(`<h2>Code du directeur</h2><p class="lead">${h(s.nom)} · le directeur entre avec le code de l’école <b>${h(s.code)}</b> et ce code à 4 chiffres, puis choisit son mot de passe.</p><form id="f-cd" class="sec" data-id="${s.id}"><div class="f"><label for="cd">Code à 4 chiffres</label><input id="cd" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required style="letter-spacing:.4em;font-size:22px;text-align:center"></div><div class="msg" id="cdmsg"></div><button class="pill lime" style="justify-content:center;padding:15px">Enregistrer le code</button></form>`)},
 entrer:b=>{const s=DB.schools.find(x=>x.id===b.dataset.id);sheet(`<div style="display:flex;gap:12px;align-items:center">${logo(s)}<div><h2>${h(s.nom)}</h2><span class="note">Code ${h(s.code)}</span></div></div>
   <form id="f-in" class="sec" data-id="${s.id}"><div class="f"><label for="in-tel">Numéro de téléphone</label><input id="in-tel" type="tel" inputmode="tel" autocomplete="username" placeholder="08x xxx xxxx" required></div>
   <div class="f"><label for="in-pw">Mot de passe</label><input id="in-pw" type="password" autocomplete="current-password" required></div><div class="msg" id="inmsg"></div>
   <button class="pill lime" style="justify-content:center;padding:15px">Entrer</button><a class="pill ghost" style="justify-content:center;text-decoration:none" href="${h(s.url)}">Première connexion (code à 4 chiffres)</a></form>`)},
 toggle:async b=>{const s=DB.schools.find(x=>x.id===b.dataset.id);if(s.actif&&b.dataset.arm!=='1'){b.dataset.arm='1';toast(`Touchez encore pour suspendre ${s.nom}`);setTimeout(()=>{b.dataset.arm=''},4000);return}const {error}=await sb.rpc('racine_set_actif',{c:s.code,a:!s.actif});if(error){toast('Action refusée.');return}toast(!s.actif?`${s.nom} : accès ouvert`:`${s.nom} : accès suspendu`);loadSchools()},
 pay:async b=>{const s=DB.schools.find(x=>x.id===b.dataset.id);const {data,error}=await sb.rpc('racine_payer',{c:s.code,mois:1});if(error){toast('Action refusée.');return}toast(`Paiement enregistré : jusqu’au ${dfr(data)}`);loadSchools()},
 newschool:()=>sheet(`<h2>Ajouter une école</h2><form id="f-new" class="sec">
   <div class="f"><label for="n-nom">Nom de l’école</label><input id="n-nom" required placeholder="Complexe Scolaire …"></div>
   <div class="g2"><div class="f"><label for="n-code">Code</label><input id="n-code" required maxlength="6" style="text-transform:uppercase" placeholder="CSXX"></div><div class="f"><label for="n-cl">Classes</label><input id="n-cl" type="number" min="1" value="6"></div></div>
   <div class="g2"><div class="f"><label for="n-com">Commune</label><input id="n-com" placeholder="Lemba"></div><div class="f"><label for="n-vil">Ville</label><input id="n-vil" value="Kinshasa"></div></div>
   <div class="f"><label for="n-dir">Directeur</label><input id="n-dir" placeholder="Nom du directeur"></div><div class="g2"><div class="f"><label for="n-cd">Code du directeur</label><input id="n-cd" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="4 chiffres" required></div><div class="f"><label for="n-dev">Devise</label><input id="n-dev" placeholder="Discipline · Travail"></div></div>
   <div class="f"><label for="n-logo">Logo (facultatif)</label><input id="n-logo" type="file" accept="image/*"></div>
   <div class="msg" id="newmsg"></div><button class="pill lime" style="justify-content:center;padding:15px">Créer l’école</button></form>`)
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='close'&&e.target!==b)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b)}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;
  if(f.id==='f-code'){const c=$('#code').value.trim().toUpperCase();const s=DB.schools.find(x=>x.code===c);if(!s){$('#codemsg').textContent='Aucune école avec ce code. Vérifiez auprès de la direction.';return}close();S.sid=s.id;S.view='ecole';render();scrollTo(0,0)}
  if(f.id==='f-in'){const s=DB.schools.find(x=>x.id===f.dataset.id);const t=normPhone($('#in-tel').value),pw=$('#in-pw').value;const m=$('#inmsg');m.style.color='';
    if(t.length<11){m.textContent='Numéro de téléphone invalide.';return}
    m.style.color='var(--hi)';m.textContent='Connexion…';
    const {error}=await sb.auth.signInWithPassword({email:emailOf(t),password:pw});
    if(error){m.style.color='';m.textContent=/invalid/i.test(error.message)?'Téléphone ou mot de passe incorrect. Première fois ? Touchez « Première connexion ».':'Connexion impossible. Vérifiez internet.';return}
    const {data}=await sb.rpc('racine_mon_ecole');const e=(data||[])[0];
    if(!e||e.code!==s.code){await sb.auth.signOut();m.style.color='';m.textContent='Ce compte n’appartient pas à cette école.';return}
    if(!e.actif){m.style.color='';m.textContent='L’accès de cette école est suspendu par racine.ia.';return}
    location.href=s.url;return}
  if(f.id==='f-cd'){const s=DB.schools.find(x=>x.id===f.dataset.id);const {error}=await sb.rpc('racine_code_directeur',{c:s.code,p_code:$('#cd').value.trim()});if(error){$('#cdmsg').textContent=/déjà/.test(error.message)?'Ce code est déjà utilisé dans cette école.':'Enregistrement impossible.';return}close();toast('Code du directeur enregistré');loadSchools();return}
  if(f.id==='f-pin'){const m=$('#pinmsg');const t=normPhone($('#ad-tel').value);m.textContent='';const {error}=await sb.auth.signInWithPassword({email:emailOf(t),password:$('#ad-pw').value});if(error){m.textContent='Téléphone ou mot de passe incorrect.';return}if(await checkAdmin()){S.admin=true;loadSchools()}else{m.textContent='Ce compte n’a pas accès à la console racine.ia.'}}
  if(f.id==='f-new'){const code=$('#n-code').value.trim().toUpperCase();if(DB.schools.some(s=>s.code===code)){$('#newmsg').textContent='Ce code est déjà utilisé par une autre école.';return}
    let lg='';const file=$('#n-logo').files[0];if(file)lg=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d');const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);r(c.toDataURL('image/jpeg',.85))};im.src=fr.result};fr.readAsDataURL(file)});
    const covs=['linear-gradient(135deg,#0d3b2e,#1f8a5b 60%,#8be0b0)','linear-gradient(135deg,#3a0f2e,#a8327a 60%,#ff9ad5)','linear-gradient(135deg,#102a43,#2f6db5 60%,#9bd0ff)'];
    const d=new Date();d.setUTCMonth(d.getUTCMonth()+1);
    const {error}=await sb.rpc('racine_creer_ecole',{p_nom:$('#n-nom').value.trim(),p_code:code,p_ville:$('#n-vil').value.trim()||'Kinshasa',p_commune:$('#n-com').value.trim()||null,p_directeur:$('#n-dir').value.trim()||null,p_couleur:covs[DB.schools.length%3],p_logo:lg||null,p_devise:$('#n-dev').value.trim()||null,p_code_dir:$('#n-cd').value.trim()});
    if(error){$('#newmsg').textContent='Création impossible : '+(/duplicate|unique/i.test(error.message)?'ce code existe déjà.':'réessayez.');return}
    close();toast('École créée');loadSchools()}
});

/* ---------- intro ---------- */
(function(){
  const P=A.parts;const box=$('#imark');const cx=P.W/2,cy=P.H/2;
  P.parts.forEach(([x,y,w,hh],i)=>{const im=document.createElement('img');im.src=A['b'+i];im.alt='';
    const mx=x+w/2-cx,my=y+hh/2-cy,len=Math.hypot(mx,my)||1;
    im.style.cssText=`left:${x/P.W*100}%;top:${y/P.H*100}%;width:${w/P.W*100}%;--dx:${mx/len*170}%;--dy:${my/len*170}%;animation-delay:${.15+i*.1}s`;box.appendChild(im)});
  $('#iword').src=A.word;
  const end=()=>{const el=$('#intro');if(el.classList.contains('out'))return;el.classList.add('out');setTimeout(()=>el.hidden=true,650)};
  $('#intro').addEventListener('click',end);$('#intro').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')end()});
  setTimeout(end,5200);
})();
render();loadSchools();checkAdmin().then(a=>{if(a){S.admin=true;if(S.view==='console')render()}});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{}));
</script>
</body></html>
